{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block page_id %}login{% endblock %}

{% block content %}
<div class="container">
  <form class="card form-card" method="post" action="/login" style="max-width:480px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <p class="eyebrow">Welcome back</p>
    <h2 style="font-size:2.2rem;margin-bottom:var(--s5)">Sign in</h2>
    {% if error %}<div class="notice warn" role="alert" style="margin-bottom:var(--s4)">{{ error }}</div>{% endif %}
    <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Sign In</button>
    <p class="muted" style="margin-top:var(--s4);text-align:center">New here? <a href="/register{{ '?next=' ~ (next|urlencode) if next }}" style="color:var(--blue);font-weight:700">Create an account</a></p>
  </form>
</div>
{% endblock %}
